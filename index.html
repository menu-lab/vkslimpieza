  <!-- Tipografías Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0c1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Contenedor Adaptativo Single-Viewport: 900x1700 */
    .app-container {
      position: relative;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      max-height: calc(100vw * (1700 / 900));
      aspect-ratio: 900 / 1700;
      background: #FFFFFF url('menu.jpg') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* 1. Carrusel de texto sobre fondo blanco puro (13.5px nítido) */
    .ticker-container {
      position: absolute;
      top: 29.5%;
      left: 3%;
      width: 94%;
      height: 30px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      z-index: 25;
    }

    .ticker-container::before,
    .ticker-container::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35px;
      z-index: 2;
      pointer-events: none;
    }
    .ticker-container::before {
      left: 0;
      background: linear-gradient(90deg, #FFFFFF, transparent);
    }
    .ticker-container::after {
      right: 0;
      background: linear-gradient(270deg, #FFFFFF, transparent);
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: marqueeScroll 28s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #0284c7;
      padding: 0 6px;
    }

    .ticker-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin: 0 9px;
      border-radius: 50%;
      background: #10b981;
    }

    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 2. Botonera calibrada (Títulos 15px, Bajadas 10.5px sin desbordes) */
    .buttons-wrapper {
      position: absolute;
      top: 35.5%;
      left: 7.5%;
      width: 85%;
      display: flex;
      flex-direction: column;
      gap: 8.5px;
      z-index: 30;
    }

    .clean-btn {
      position: relative;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: #FFFFFF;
      border-radius: 50px;
      text-decoration: none;
      border: 1.5px solid #e0f2fe;
      box-shadow: 0 4px 10px rgba(12, 74, 110, 0.1), 0 2px 0 #bae6fd;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clean-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 2px 4px rgba(12, 74, 110, 0.1), 0 1px 0 #7dd3fc;
    }

    .clean-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      border: 1px solid #FFFFFF;
    }

    .clean-icon svg {
      width: 19px;
      height: 19px;
      fill: #FFFFFF;
    }

    .btn-instagram { border-color: #FED7AA; }
    .btn-instagram .clean-icon {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
    }

    .btn-whatsapp { border-color: #BBF7D0; }
    .btn-whatsapp .clean-icon {
      background: linear-gradient(135deg, #25D366, #128C7E);
    }

    .btn-especial { border-color: #BAE6FD; }
    .btn-especial .clean-icon {
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }

    .clean-text {
      flex: 1;
      text-align: left;
    }

    .clean-text .label {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #0c4a6e;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .clean-text .sub {
      font-size: 10.5px;
      color: #475569;
      font-weight: 600;
      margin-top: 2px;
      line-height: 1.2;
    }

    .hand-cursor {
      position: absolute;
      right: 13px;
      bottom: -6px;
      width: 18px;
      height: 18px;
      animation: tapGesture 2s infinite ease-in-out;
      pointer-events: none;
    }

    .hand-cursor svg {
      width: 100%;
      height: 100%;
      fill: #0c4a6e;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }

    @keyframes tapGesture {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50% { transform: translateY(-4px) rotate(-5deg); }
    }

    /* 3. Franja completa de fotos de lado a lado (Zona blanca 55% a 87%) */
    .photo-banner-strip {
      position: absolute;
      top: 55%;
      left: 0;
      width: 100%;
