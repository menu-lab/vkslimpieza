<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VKS Clean - Soluciones Profesionales de Limpieza</title>

  <!-- Favicon Oficial 32x32 px en Base64 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Cpath d='M16 3C16 3 8 13 8 19a8 8 0 0 0 16 0c0-6-8-16-8-16z' fill='%230ea5e9'/%3E%3Cpath d='M16 9c-2 4-5 8-5 11a5 5 0 0 0 8.5 3.5C21 21 21 16 16 9z' fill='%2310b981'/%3E%3Cpolygon points='16,14 17.5,17.5 21,18 18.5,20.5 19,24 16,22 13,24 13.5,20.5 11,18 14.5,17.5' fill='%23ffffff'/%3E%3C/svg%3E">

  <!-- Tipografías Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0c1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    /* Contenedor Adaptativo Single-Viewport: Relación 900x1700 */
    .app-container {
      position: relative;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      max-height: calc(100vw * (1700 / 900));
      aspect-ratio: 900 / 1700;
      background: #FFFFFF url('menu.jpg') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* 1. Carrusel de texto sobre fondo blanco puro */
    .ticker-container {
      position: absolute;
      top: 31.8%;
      left: 5%;
      width: 90%;
      height: 28px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      z-index: 20;
    }

    .ticker-container::before,
    .ticker-container::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35px;
      z-index: 2;
      pointer-events: none;
    }
    .ticker-container::before {
      left: 0;
      background: linear-gradient(90deg, #FFFFFF, transparent);
    }
    .ticker-container::after {
      right: 0;
      background: linear-gradient(270deg, #FFFFFF, transparent);
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: marqueeScroll 32s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #0284c7;
      padding: 0 4px;
    }

    .ticker-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      margin: 0 9px;
      border-radius: 50%;
      background: #10b981;
    }

    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 2. Botonera compacta */
    .buttons-wrapper {
      position: absolute;
      top: 37.2%;
      left: 8.5%;
      width: 83%;
      display: flex !important;
      flex-direction: column;
      gap: 8.5px;
      z-index: 25 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .clean-btn {
      position: relative;
      display: flex !important;
      align-items: center;
      padding: 6.5px 14px;
      background: #FFFFFF !important;
      border-radius: 50px;
      text-decoration: none;
      border: 1.5px solid #e0f2fe;
      box-shadow: 0 4px 10px rgba(12, 74, 110, 0.08), 0 2px 0 #bae6fd;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    }

    .clean-btn:active {
      transform: translateY(1.5px) scale(0.98);
      box-shadow: 0 2px 4px rgba(12, 74, 110, 0.1), 0 1px 0 #7dd3fc;
    }

    .clean-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      border: 1px solid #FFFFFF;
    }

    .clean-icon svg {
      width: 17px;
      height: 17px;
      fill: #FFFFFF;
    }

    .btn-instagram { border-color: #FED7AA; }
    .btn-instagram .clean-icon {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
    }

    .btn-whatsapp { border-color: #BBF7D0; }
    .btn-whatsapp .clean-icon {
      background: linear-gradient(135deg, #25D366, #128C7E);
    }

    .btn-especial { border-color: #BAE6FD; }
    .btn-especial .clean-icon {
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }

    .clean-text {
      flex: 1;
      text-align: left;
    }

    .clean-text .label {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #0c4a6e;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .clean-text .sub {
      font-size: 8.8px;
      color: #64748b;
      font-weight: 600;
      margin-top: 1px;
      line-height: 1.15;
    }

    .hand-cursor {
      position: absolute;
      right: 12px;
      bottom: -5px;
      width: 16px;
      height: 16px;
      animation: tapGesture 2s infinite ease-in-out;
      pointer-events: none;
    }

    .hand-cursor svg {
      width: 100%;
      height: 100%;
      fill: #0c4a6e;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }

    @keyframes tapGesture {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50% { transform: translateY(-3px) rotate(-5deg); }
    }

    /* 3. Franja continua de lado a lado para fotografías (en la zona blanca) */
    .photo-banner-strip {
      position: absolute;
      top: 56%;
      left: 0;
      width: 100%;
      height: 31%;
      overflow: hidden;
      background: transparent;
      z-index: 10;
    }

    .photo-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      z-index: 1;
      transform: scale(1.0);
      transition: opacity 2s ease-in-out;
      will-change: opacity, transform;
    }

    .photo-slide.is-visible {
      opacity: 1;
      z-index: 2;
      animation: gentlePan 8s ease-out forwards;
    }

    .photo-slide.is-leaving {
      opacity: 0;
      z-index: 1;
    }

    @keyframes gentlePan {
      0% { transform: scale(1.0) translate(0, 0); }
      100% { transform: scale(1.05) translate(-1%, -0.5%); }
    }

    /* 4. Footer Fijo: subido 1% (a 89.6%) y corrido 2% a la izquierda (a 34%) */
    .btn-visitanos-touch {
      position: absolute;
      top: 89.6%;
      left: 34%;
      width: 53%;
      height: 5.8%;
      border-radius: 30px;
      z-index: 30;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 4px;
      line-height: 1.25;
      transition: background-color 0.15s ease;
    }

    .btn-visitanos-touch:active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .address-line-1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      color: #FFFFFF;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .address-line-2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      color: #e0f2fe;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <main class="app-container" id="appContainer">

    <!-- 1. Marquesina sobre fondo blanco puro -->
    <div class="ticker-container" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">Pisos<span class="ticker-dot"></span></span>
        <span class="ticker-item">Baños<span class="ticker-dot"></span></span>
        <span class="ticker-item">Cocina<span class="ticker-dot"></span></span>
